<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2A4A"/>
      <stop offset="100%" stop-color="#0F1729"/>
    </linearGradient>
    <linearGradient id="greenArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="26" fill="url(#bg3)"/>

  <!-- Cycle: red arc (fail) -->
  <path d="M 64 24 A 40 40 0 0 1 100 46" fill="none" stroke="#F87171" stroke-width="9" stroke-linecap="round"/>
  <!-- arrowhead for red -->
  <polygon points="100,46 108,42 104,52" fill="#F87171"/>

  <!-- green arc (pass) -->
  <path d="M 100 46 A 40 40 0 0 1 64 104" fill="none" stroke="url(#greenArc)" stroke-width="9" stroke-linecap="round"/>
  <polygon points="64,104 70,111 58,111" fill="#22C55E"/>

  <!-- amber arc (refactor) -->
  <path d="M 64 104 A 40 40 0 0 1 28 46" fill="none" stroke="#FBBF24" stroke-width="9" stroke-linecap="round"/>
  <polygon points="28,46 22,40 33,38" fill="#FBBF24"/>

  <!-- closing thin segment back to top (visual continuity) -->
  <path d="M 28 46 A 40 40 0 0 1 64 24" fill="none" stroke="#FBBF24" stroke-width="9" stroke-linecap="round" opacity="0.35"/>

  <!-- center checkmark -->
  <g transform="translate(64,64)">
    <circle r="20" fill="#0F1729" stroke="#22C55E" stroke-width="2.5" opacity="0.9"/>
    <path d="M -9 1 L -2 9 L 11 -8" fill="none" stroke="#4ADE80" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
